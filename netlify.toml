[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA fallback — let React handle client-side routes while
# /.netlify/functions/* requests pass straight through.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
